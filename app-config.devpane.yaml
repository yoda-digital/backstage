app:
  title: DevPane Developer Portal
  baseUrl: ${PORTAL_BASE_URL}

organization:
  name: Esempla

backend:
  baseUrl: ${BACKEND_BASE_URL}
  listen:
    host: 0.0.0.0
    port: 7007
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
  auth:
    dangerouslyDisableDefaultAuthPolicy: true
  cors:
    origin: ${PORTAL_BASE_URL}
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true

integrations:
  gitlab:
    - host: git.esempla.systems
      apiBaseUrl: https://git.esempla.systems/api/v4
      token: ${GITLAB_TOKEN}

auth:
  environment: production
  providers:
    guest:
      dangerouslyAllowOutsideDevelopment: true
    # GitLab OAuth — uncomment when Dumitru creates the app
    # gitlab:
    #   production:
    #     clientId: ${AUTH_GITLAB_CLIENT_ID}
    #     clientSecret: ${AUTH_GITLAB_CLIENT_SECRET}
    #     audience: https://git.esempla.systems
    #     callbackUrl: ${BACKEND_BASE_URL}/api/auth/gitlab/handler/frame
    #     signIn:
    #       resolvers:
    #         - resolver: usernameMatchingUserEntityName

catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration
  rules:
    - allow:
        - Component
        - API
        - Resource
        - System
        - Domain
        - Location
        - Template
        - Group
        - User
  providers:
    gitlab:
      esempla:
        host: git.esempla.systems
        branch: main
        fallbackBranch: master
        skipForkedRepos: false
        schedule:
          frequency: { minutes: 10 }
          timeout: { minutes: 3 }
    gitlabOrg:
      esempla:
        host: git.esempla.systems
        schedule:
          frequency: { minutes: 30 }
          timeout: { minutes: 3 }

techdocs:
  builder: external
  publisher:
    type: local

search:
  pg: {}

permission:
  enabled: true

# Required by kubernetes-backend even when no clusters configured
kubernetes:
  serviceLocatorMethod:
    type: multiTenant
  clusterLocatorMethods: []

backend:
  csp:
    connect-src: ["'self'", "http:", "https:"]
    script-src: ["'self'", "'unsafe-eval'", "https://static.cloudflareinsights.com"]

# AI Gateway — Ollama on host
aiGateway:
  providers:
    ollama:
      baseUrl: http://host.docker.internal:11434
      defaultModel: qwen3-8b-shared
      models:
        - id: qwen3-8b-shared
          name: Qwen3 8B
          capabilities: [chat, completion]
        - id: qwen38-27b-shared
          name: Qwen3.8 27B
          capabilities: [chat, completion]

# AI Assistant — use Ollama via gateway
aiAssistant:
  defaultModel: qwen3-8b-shared
  gateway:
    baseUrl: http://localhost:7007/api/ai-gateway

# Embeddings for RAG
aiEmbeddings:
  provider: ollama
  model: bge-m3
  baseUrl: http://host.docker.internal:11434
