app:
  baseUrl: ${PORTAL_BASE_URL}

backend:
  baseUrl: ${BACKEND_BASE_URL}
  listen:
    host: 0.0.0.0
    port: 7007
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}

auth:
  environment: production
  providers:
    guest:
      dangerouslyAllowOutsideDevelopment: true

# Kubernetes — leave empty object if not configured yet, prevents crash
kubernetes:
  clusterLocatorMethods: []

# GrowthBook — provide a default so the plugin starts
growthbook:
  apiUrl: ${GROWTHBOOK_API_URL}
  apiKey: ${GROWTHBOOK_API_KEY}

catalog:
  locations:
    - type: file
      target: ./examples/entities.yaml
    - type: file
      target: ./examples/template/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ./examples/org.yaml
      rules:
        - allow: [User, Group]
