services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-backstage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-DevPane2026!}
      POSTGRES_DB: ${POSTGRES_DB:-backstage}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-backstage}']
      interval: 10s
      timeout: 5s
      retries: 5

  backstage:
    image: ghcr.io/yoda-digital/backstage:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-backstage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-DevPane2026!}
      PORTAL_BASE_URL: ${PORTAL_BASE_URL:-https://ai.esemplagov.tech}
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-https://ai.esemplagov.tech}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      GROWTHBOOK_API_URL: ${GROWTHBOOK_API_URL:-http://localhost:3100}
      GROWTHBOOK_API_KEY: ${GROWTHBOOK_API_KEY:-not-configured}

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      - backstage
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}

volumes:
  pgdata:
