version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-backstage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-backstage}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-backstage}']
      interval: 10s
      timeout: 5s
      retries: 5

  backstage:
    image: ghcr.io/yoda-digital/backstage:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-backstage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      # Set these in .env for your deployment:
      PORTAL_BASE_URL: ${PORTAL_BASE_URL:-http://localhost:7007}
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-http://localhost:7007}
      # GitLab integration (set in .env)
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      AUTH_GITLAB_CLIENT_ID: ${AUTH_GITLAB_CLIENT_ID:-}
      AUTH_GITLAB_CLIENT_SECRET: ${AUTH_GITLAB_CLIENT_SECRET:-}
      # Azure DevOps (set in .env)
      AZURE_TOKEN: ${AZURE_TOKEN:-}
      # Kubernetes (set in .env)
      K8S_CLUSTER_NAME: ${K8S_CLUSTER_NAME:-}
      K8S_CLUSTER_URL: ${K8S_CLUSTER_URL:-}
      K8S_SERVICE_ACCOUNT_TOKEN: ${K8S_SERVICE_ACCOUNT_TOKEN:-}
    # No ports exposed — Cloudflare Tunnel handles ingress
    # Uncomment for local testing without tunnel:
    # ports:
    #   - '7007:7007'

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      - backstage
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env}

volumes:
  postgres_data:
